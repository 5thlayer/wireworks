version = 1

# Java files carry their own SPDX headers. This file marks everything that
# can't hold one.

[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    ".gitattributes",
    ".claude/settings.json",
    ".gitmodules",
    "**/*.mods.toml",
    "scripts/*.py",
    "**/*.md",
    "src/main/resources/**/*.json",
    "src/gametest/resources/**/*.json",
    "src/gametest/resources/**/*.mcmeta",
    "src/main/resources/**/*.nbt",
    "src/main/resources/**/*.png",
    "src/main/resources/**/*.mcmeta",
    "LICENSE",
    "publish/summary.txt",
    ".github/**",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Cover and icon for mod pages. Their ground is Minecraft's own dirt texture,
# which stays Mojang's; see LICENSES/LicenseRef-Mojang.txt.
[[annotations]]
path = ["publish/*.png"]
SPDX-FileCopyrightText = ["Mojang AB", "2026 5thlayer"]
SPDX-License-Identifier = "LicenseRef-Mojang"

# Bioresin's, plastic's, the battery's and the fuel cells' item textures, the Accumulator's top and
# bottom, the plating the Solar Panel, the Boiler and the Reactor share, the lit smelter's animation
# beside the Boiler's front, the Steam Turbine's coil and running fan, the Reactor's steel and vent,
# the Steam Engine's intake and duct, and the unmodified copies under data/art/ that the adapted
# textures are built from, are Malcolm Riley's, from
# https://github.com/malcolmriley/unused-textures, unmodified; see docs/placeholder-art.md.
[[annotations]]
path = [
    "src/main/resources/assets/wireworks/textures/item/bioresin.png",
    "src/main/resources/assets/wireworks/textures/item/plastic.png",
    "src/main/resources/assets/wireworks/textures/item/battery.png",
    "src/main/resources/assets/wireworks/textures/item/fuel_cell.png",
    "src/main/resources/assets/wireworks/textures/item/depleted_fuel_cell.png",
    "src/main/resources/assets/wireworks/textures/block/accumulator/top.png",
    "src/main/resources/assets/wireworks/textures/block/accumulator/bottom.png",
    "src/main/resources/assets/wireworks/textures/block/plating/*.png",
    "src/main/resources/assets/wireworks/textures/block/boiler/front_on.png.mcmeta",
    "src/main/resources/assets/wireworks/textures/block/steam_turbine/coil_end.png",
    "src/main/resources/assets/wireworks/textures/block/steam_turbine/fan_on.png",
    "src/main/resources/assets/wireworks/textures/block/steam_turbine/fan_on.png.mcmeta",
    "src/main/resources/assets/wireworks/textures/block/reactor/*.png",
    "src/main/resources/assets/wireworks/textures/block/steam_engine/intake.png",
    "src/main/resources/assets/wireworks/textures/block/steam_engine/duct.png",
    "data/art/*.png",
    "data/art/*.png.mcmeta",
]
precedence = "override"
SPDX-FileCopyrightText = "Malcolm Riley"
SPDX-License-Identifier = "CC-BY-4.0"

# The Boiler's front, the Accumulator's sides, the Solar Panel's cell, the Steam Turbine's still
# fan and coil side and the Steam Engine's front, adapted from Malcolm Riley's smelter, battery
# block, blue cement, duct fan, copper coil, duct panels and copper tank by
# scripts/build-textures.py; see docs/placeholder-art.md.
[[annotations]]
path = [
    "src/main/resources/assets/wireworks/textures/block/boiler/front_*.png",
    "src/main/resources/assets/wireworks/textures/block/accumulator/sides.png",
    "src/main/resources/assets/wireworks/textures/block/solar_panel/cell.png",
    "src/main/resources/assets/wireworks/textures/block/steam_turbine/fan_off.png",
    "src/main/resources/assets/wireworks/textures/block/steam_turbine/coil_side.png",
    "src/main/resources/assets/wireworks/textures/block/steam_engine/cylinder_*.png",
    "src/main/resources/assets/wireworks/textures/block/steam_engine/wheel_*.png",
]
precedence = "override"
SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"
