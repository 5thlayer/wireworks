# The game test server's config, copied over run/gametest's before each run. The large pole is
# configured off its defaults, which are Factorio's, so a config that never reached the
# tiers fails ConfigTests rather than passing on the defaults. No other test leans on the
# large pole's reach, and its area only shrinks: the creative pole has the large pole's area, and a larger
# area would supply consumers the network tests keep out of its reach.

[small]
	supplySize = 5
	wireReach = 7.5

[medium]
	supplySize = 7
	wireReach = 9.0

[large]
	supplySize = 16
	wireReach = 21.5

# The Solar Panel's and the Accumulator's defaults, since the tests state their numbers: 30 FE/t,
# and 50,000 FE at 150 FE/t.
[solar_panel]
	peak_watts = 60000

[accumulator]
	capacity_joules = 5000000
	max_watts = 300000

# The Transmission Pole is configured off its default of 32, for the same reason as the large pole,
# and short on purpose. Finished tests stay standing and tick, and tests stand 28 blocks apart, so a
# reach longer than the gap (11 blocks between one test's easternmost pole and the next test's
# westernmost) would auto-wire a test's poles into a neighbour's. Each test's own wires are at most 8 (the creative pole to its Transformer is 7).
[transmission]
	wireReach = 9.0

# The Transformer is configured off its defaults of 32 and 9 too, and short for the same reason.
[transformer]
	lineReach = 9.0
	districtReach = 8.0

# The Boiler's fuel conversion is configured off its default of 2500 too, so a config that never
# reached it fails ConfigTests. Coal's 1600 burn ticks are then 8 MJ, and BoilerTests state no joules.
[boiler]
	joules_per_burn_tick = 5000
