# The game test server's config, copied over run/gametest's before each run. The large pole is
# configured off its defaults, which are Factorio's, so a config that never reached the
# tiers fails ConfigTests rather than passing on the defaults. No other test leans on the
# large pole's reach, and its area only shrinks: the creative pole has the large pole's area, and a larger
# area would supply consumers the network tests keep out of its reach.

[small]
	supplySize = 5
	wireReach = 7.5

[medium]
	supplySize = 7
	wireReach = 9.0

[large]
	supplySize = 16
	wireReach = 21.5

# The Solar Panel's and the Accumulator's defaults, since the tests state their numbers: 30 FE/t,
# and 50,000 FE at 150 FE/t.
[solar_panel]
	peak_watts = 60000

[accumulator]
	capacity_joules = 5000000
	max_watts = 300000
