modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/${mod_id}/issues"
license = "MIT"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Library's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
credits = "Bioresin, plastic, battery, fuel cell, Accumulator, Solar Panel, Boiler, Steam Turbine and Reactor textures (the Boiler's front, the Accumulator's sides, the Solar Panel's cell and the Steam Turbine's still fan and coil side adapted) by Malcolm Riley (github.com/malcolmriley/unused-textures), CC-BY-4.0"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "groundworks"
type = "required"
versionRange = "${groundworks_range}"
ordering = "NONE"
side = "BOTH"

# libworks-runtime, nested by jar-in-jar: the Boiler's item and fluid faces are its GuardedResourceHandler.
# The range is the one libworks { runtime } in build.gradle nests, to the next minor.
[[dependencies.${mod_id}]]
modId = "libworks"
type = "required"
versionRange = "${libworks_runtime_range}"
ordering = "NONE"
side = "BOTH"
