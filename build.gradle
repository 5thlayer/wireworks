// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing and the release and upload tasks come from the libworks convention plugin (libworks ADR 0003).
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.1.2'
}

repositories {
    // Groundworks and libworks-runtime, from the local maven only, where their releases are published.
    // CI builds their tags there first.
    mavenLocal {
        content {
            includeModule 'io.github.5thlayer', 'groundworks'
            includeModule 'io.github.5thlayer', 'libworks-runtime'
        }
    }
    maven { url = 'https://cursemaven.com' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// What the Library requires of the other Libraries, each as a range whose lower bound is a released version:
// the one it is built and run against and the one CI builds from its tag. neoforge.mods.toml names each as
// ${<name>_range}.
libworks {
    // Required at load and not bundled (ADR 0010). The lower bound rises with the version the Library
    // takes; the cap is the next minor, 0.6, which moves when the Library takes it.
    upstream('groundworks') {
        // Groundworks' tags are v<version>.
        tagPrefix = 'v'
        range = '[0.5.4,0.6)'
    }
    // Nested by jar-in-jar, so players install nothing more; FML loads the newest nested copy in range,
    // which runs to the next minor.
    runtime = '0.1.1'
}

neoForge {
    runs {
        client {
            // EMI still uses @OnlyIn, and the warning screen it raises would stop the quick play.
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }
        gameTestServer {
            // Registers the Library's tests and test group; a Consumer's game test server leaves it unset.
            systemProperty 'wireworks.gametest', 'true'
        }
    }
}

// The server reads its config from the game test run's config folder, which no checkout keeps. The copy
// goes over whatever an earlier run left there, so every run tests the same config.
def gameTestConfig = file('src/gametest/wireworks-server.toml')
tasks.named('runGameTestServer') {
    inputs.file gameTestConfig
    doFirst {
        copy {
            from gameTestConfig
            into neoForge.runs.gameTestServer.gameDirectory.dir('config')
        }
    }
}

dependencies {
    // localRuntime: mods on the dev runs that the published jar does not depend on.
    // Jade finds the pole's tooltip plugin by its annotation, so the Library runs without it.
    // 26.1.11, the least Craftworks accepts, since it shares the dev runs.
    compileOnly 'maven.modrinth:jade:26.1.11+neoforge'
    localRuntime 'maven.modrinth:jade:26.1.11+neoforge'
    localRuntime 'curse.maven:emi-unofficial-port-1544558:8630349'
    // Craftworks 0.4.1, its CurseForge file, on the dev runs and the game test server: its Assembler
    // draws FE, so a pole has a machine to feed, and is a Groundworks footprint from a mod that doesn't
    // build against Wireworks, which a pole counts once. Wireworks names none of its code.
    localRuntime 'curse.maven:craftworks-1715876:9078919'

    // The JUnit tests run on a plain JVM, with no Minecraft on their classpath: they test the rules
    // that read no game state, and the game tests test the rest. A Library whose rules need game types
    // adds `addModdingDependenciesTo sourceSets.test` to the neoForge block.
    // DataFixerUpper, and only that: Codec is Mojang's serialisation library, not a Minecraft type,
    // so the wire store's codec round-trips on a plain JVM. The version is the one Minecraft 26.1.2 ships.
    testImplementation 'com.mojang:datafixerupper:9.0.19'
    testImplementation 'com.google.code.gson:gson:2.13.2'
}
