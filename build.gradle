plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = maven_group
version = mod_version
base.archivesName = archives_name

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

// The Minecraft version goes in the jar's name and not in the Library's version:
// wireworks-26.1.2-0.1.0.jar.
tasks.withType(Jar).configureEach {
    archiveVersion = "$minecraft_version-$mod_version"
}

repositories {
    // Groundworks: its releases are published to the local maven repository only.
    mavenLocal()
    maven { url = 'https://cursemaven.com' }
}

def gameTestReport = layout.buildDirectory.file('reports/gametest.xml').get().asFile

// The Groundworks versions the Library nests and, through neoforge.mods.toml, accepts at load.
// 0.5.2 is the first with footprints, and still overlaps Beltworks' range, so a pack holding both
// loads one Groundworks.
def groundworksRange = '[0.5.2,0.6)'

neoForge {
    version = neoforge_version

    runs {
        // The same player every launch, so a dev save keeps its inventory and position.
        client {
            client()
            programArguments.addAll '--username', 'Developer', '--uuid', '123456781234123412341234567890ab'
            // -PquickPlay=<save> opens that save straight from launch (the skillworks:quicklaunch skill).
            programArguments.addAll providers.gradleProperty('quickPlay').map { ['--quickPlaySingleplayer', it] }.orElse([])
        }
        // Runs the Library's game tests headless and exits, non-zero if any fails. 26.1 has no
        // namespace property, so the selector is what keeps vanilla's tests out.
        // A directory of its own, so nothing the dev client loads or saves reaches it.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            // Registers the Library's tests and test group; a Consumer's game test server leaves it unset.
            systemProperty 'wireworks.gametest', 'true'
            programArguments.addAll '--tests', "${mod_id}:*", '--report', gameTestReport.absolutePath
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

// The server says only how many tests passed, so the report is read back to name them: a green
// run that didn't run a test is no evidence for it. The report, not the exit code, decides, so a
// failing run still names its tests; a server that crashes writes no report and fails here too.
// The server writes the report but not its folder, which a clean checkout has yet to make.
// The server reads its config from run/gametest/config, which no checkout keeps. The copy goes
// over whatever an earlier run left there, so every run tests the same config.
def gameTestConfig = file('src/gametest/wireworks-server.toml')
tasks.named('runGameTestServer') {
    ignoreExitValue = true
    inputs.file gameTestConfig
    doFirst {
        copy {
            from gameTestConfig
            into 'run/gametest/config'
        }
        gameTestReport.delete()
        gameTestReport.parentFile.mkdirs()
    }
    doLast {
        if (!gameTestReport.exists()) throw new GradleException("The game test server wrote no report at $gameTestReport")
        def cases = new groovy.xml.XmlSlurper().parse(gameTestReport).'**'.findAll { it.name() == 'testcase' }
        if (cases.isEmpty()) throw new GradleException('The game test server ran no tests')
        cases.each { logger.lifecycle("${it.failure.size() ? 'FAILED' : 'passed'}  ${it.@name}") }
        def failed = cases.count { it.failure.size() }
        if (failed) throw new GradleException("$failed of ${cases.size()} game tests failed")
    }
}

dependencies {
    // Bundled, so the Library runs with nothing else installed.
    jarJar(implementation('io.github.5thlayer:groundworks')) {
        version {
            strictly groundworksRange
            prefer '0.5.2'
        }
    }
    // Jade finds the pole's tooltip plugin by its annotation, so the Library runs without it.
    compileOnly 'curse.maven:jade-324717:8651070'

    // DataFixerUpper, and only that: Codec is Mojang's serialisation library, not a Minecraft type,
    // so the wire store's codec round-trips on a plain JVM. The version is the one Minecraft 26.1.2 ships.
    testImplementation 'com.mojang:datafixerupper:9.0.19'
    testImplementation 'com.google.code.gson:gson:2.13.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The JUnit tests run on a plain JVM, with no Minecraft on their classpath: they test the rules
// that read no game state, and the game tests test the rest. A Library whose rules need game types
// adds `addModdingDependenciesTo sourceSets.test` to the neoForge block.
test {
    useJUnitPlatform()
}

// The jar is what players are handed, so it carries the MIT licence the Library is under.
def jarLicensing = ['LICENSE', 'LICENSES/MIT.txt']
tasks.named('jar', Jar) {
    from(rootDir) { include jarLicensing }
}

// Fails the build when the jar lost its licensing.
def checkJarLicensing = tasks.register('checkJarLicensing') {
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file jarFile
    doLast {
        def names = new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip -> zip.entries()*.name as Set }
        def missing = jarLicensing.findAll { !names.contains(it) }
        if (missing) throw new GradleException("${jarFile.get().asFile.name} lacks its licensing: ${missing.join(', ')}")
    }
}
tasks.named('check') { dependsOn checkJarLicensing }

// neoforge.mods.toml names nothing of its own: it is filled from gradle.properties.
def modProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_description: mod_description, version: mod_version,
        minecraft_version: minecraft_version, neoforge_version: neoforge_version,
        groundworksRange: groundworksRange,
]
processResources {
    inputs.properties modProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand modProperties
    }
}

// Maven local only, which is where a Consumer's development build and the Pack's pin read the
// Library's jar (release-train). Nothing here publishes anywhere else.
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

// A version in the local maven repository never changes: Consumers resolve it by version and the
// Pack pins its sha256, so a fix is the next patch version (docs/agents/releases.md). Gradle's own
// mavenLocal() says where that is, and it's removed again so nothing resolves from it.
tasks.withType(PublishToMavenLocal).configureEach {
    def local = repositories.mavenLocal()
    repositories.remove(local)
    def published = new File(local.url.path, "${maven_group.replace('.', '/')}/$archives_name/$mod_version")
    doFirst {
        if (published.exists()) throw new GradleException(
                "$mod_name $mod_version is already in $published, and a published version never changes: bump mod_version")
    }
}
