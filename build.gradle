// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing and the release and upload tasks come from the libworks convention plugin (libworks ADR 0003).
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.3.0'
}

repositories {
    // Groundworks and libworks-runtime, from the local maven only, where their releases are published.
    // CI builds their tags there first.
    mavenLocal {
        content {
            includeModule 'io.github.5thlayer', 'groundworks'
            includeModule 'io.github.5thlayer', 'libworks-runtime'
            includeModule 'io.github.5thlayer', 'libworks-gametest'
        }
    }
    maven { url = 'https://cursemaven.com' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// What the Module requires of the other Modules, each as a range whose lower bound is a released version:
// the one it is built and run against and the one CI builds from its tag. neoforge.mods.toml names each as
// ${<name>_range}.
libworks {
    // Required at load and not bundled (ADR 0010). The lower bound rises with the version the Module
    // takes; the cap is the next minor, 0.6, which moves when the Module takes it.
    upstream('groundworks') {
        // Groundworks' tags are v<version>.
        tagPrefix = 'v'
        range = '[0.5.11,0.6)'
    }
    // Nested by jar-in-jar, so players install nothing more; FML loads the newest nested copy in range,
    // which runs to the next minor.
    runtime = '0.1.9'
}

neoForge {
    runs {
        client {
            // EMI still uses @OnlyIn, and the warning screen it raises would stop the quick play.
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }
        gameTestServer {
            // Registers the Module's tests and test group; a Consumer's game test server leaves it unset.
            systemProperty 'wireworks.gametest', 'true'
        }
    }
}

// The server reads its config from the game test run's config folder, which no checkout keeps. The copy
// goes over whatever an earlier run left there, so every run tests the same config.
def gameTestConfig = file('src/gametest/wireworks-server.toml')
tasks.named('runGameTestServer') {
    inputs.file gameTestConfig
    doFirst {
        copy {
            from gameTestConfig
            into neoForge.runs.gameTestServer.gameDirectory.dir('config')
        }
    }
}

// 26.1 has no per-run classpath, so the dev client's mods go into its mods folder, which holds only
// what is listed here; the game test server loads Groundworks and nothing else (FactoryWorks ADR-0127).
configurations {
    clientMods { transitive = false }
}

def syncClientMods = tasks.register('syncClientMods', Sync) {
    from configurations.clientMods
    into layout.projectDirectory.dir('run/mods')
}

tasks.named('runClient') { dependsOn syncClientMods }

dependencies {
    // Jade finds the machines' tooltip plugins by their annotation, so the Module runs without it.
    // 26.1.11, the least Craftworks accepts, since it shares the dev client.
    compileOnly 'maven.modrinth:jade:26.1.11+neoforge'
    clientMods 'maven.modrinth:jade:26.1.11+neoforge'
    // EMI finds bioresin's brewing by its annotation, and libworks-runtime's plugin offers the Boiler's and the
    // Reactor's ghosts, so the Module runs without it too.
    compileOnly 'curse.maven:emi-unofficial-port-1544558:8630349'
    clientMods 'curse.maven:emi-unofficial-port-1544558:8630349'
    // Craftworks' Assembler draws FE, so a pole has a machine to feed. Wireworks names none of its code.
    clientMods 'curse.maven:craftworks-1715876:9146981'

    // The JUnit tests run on a plain JVM, with no Minecraft on their classpath: they test the rules
    // that read no game state, and the game tests test the rest. A Module whose rules need game types
    // adds `addModdingDependenciesTo sourceSets.test` to the neoForge block.
    // DataFixerUpper, and only that: Codec is Mojang's serialisation library, not a Minecraft type,
    // so the wire store's codec round-trips on a plain JVM. The version is the one Minecraft 26.1.2 ships.
    testImplementation 'com.mojang:datafixerupper:9.0.19'
    testImplementation 'com.google.code.gson:gson:2.13.2'
}
