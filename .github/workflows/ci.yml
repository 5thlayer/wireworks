# Builds and tests every push through the CI every Module shares, at the tag of the plugin
# build.gradle applies: the two versions move together (libworks ADR 0003). It never publishes:
# a Library's jar reaches the Pack only through ~/.m2, and Modrinth and CurseForge, only from a
# maintainer's machine (docs/agents/releases.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: 5thlayer/libworks/.github/workflows/module-ci.yml@plugin-v0.1.2

  # The stand-in textures are drawn by the script, never by hand (docs/placeholder-art.md).
  textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/build-placeholder-textures.py --check
